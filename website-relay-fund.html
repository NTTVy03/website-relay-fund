  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"a19b8024-3265-4376-a0c5-a24be5d17dbe\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"47edc6bb-19f1-420f-9edd-b7a4bd19ac7e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    /* ===== TOKENS ===== */\n    :root {\n      --blue:       #1E4D96;\n      --blue-dark:  #153A74;\n      --blue-deep:  #0C1F50;\n      --pink:       #D83D8A;\n      --pink-soft:  #EF59A1;\n      --pink-pale:  #FFE8F4;\n      --cream:      #FDF7FA;\n      --rose-bg:    #FFF2F8;\n      --white:      #FFFFFF;\n      --text:       #111827;\n      --muted:      #6B7280;\n      --border:     #F0D8E8;\n      --radius:     16px;\n      --radius-sm:  8px;\n      --shadow:     0 4px 24px rgba(30,77,150,.10);\n      --shadow-lg:  0 12px 48px rgba(30,77,150,.16);\n      --transition: .3s cubic-bezier(.4,0,.2,1);\n    }\n    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n    html { scroll-behavior: smooth; font-size: 16px; }\n    body {\n      font-family: 'Be Vietnam Pro', sans-serif;\n      color: var(--text);\n      background: var(--white);\n      line-height: 1.65;\n      overflow-x: hidden;\n    }\n    img { display: block; max-width: 100%; }\n    a { color: inherit; text-decoration: none; }\n    button { cursor: pointer; font-family: inherit; }\n\n    /* ===== UTILITY ===== */\n    .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; }\n    .section { padding: 96px 0; }\n    .section--cream { background: var(--rose-bg); }\n    .section--blue  { background: var(--blue-deep); color: var(--white); }\n    .section--pink  { background: var(--pink); color: var(--white); }\n    .badge {\n      display: inline-block;\n      padding: 6px 16px;\n      border-radius: 100px;\n      font-size: .75rem;\n      font-weight: 700;\n      letter-spacing: .08em;\n      text-transform: uppercase;\n    }\n    .badge--pink  { background: var(--pink-pale); color: var(--pink); }\n    .badge--blue  { background: rgba(27,80,190,.12); color: var(--blue); }\n    .badge--white { background: rgba(255,255,255,.18); color: var(--white); }\n    .section-label {\n      display: flex;\n      align-items: center;\n      gap: 12px;\n      margin-bottom: 18px;\n    }\n    .section-label::after {\n      content: '';\n      flex: 1;\n      max-width: 48px;\n      height: 2px;\n      background: currentColor;\n      opacity: .3;\n    }\n    h1,h2,h3,h4 { line-height: 1.2; font-weight: 800; }\n    h2 { font-size: clamp(2rem, 4vw, 2.75rem); }\n    h3 { font-size: clamp(1.25rem, 2.5vw, 1.5rem); }\n    .text-pink { color: var(--pink); }\n    .text-blue { color: var(--blue); }\n    .text-muted { color: var(--muted); }\n\n    /* ===== BUTTONS ===== */\n    .btn {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      padding: 14px 28px;\n      border-radius: 100px;\n      font-weight: 700;\n      font-size: .9rem;\n      border: 2px solid transparent;\n      transition: var(--transition);\n      white-space: nowrap;\n    }\n    .btn--pink  { background: var(--pink); color: var(--white); }\n    .btn--pink:hover { background: #c41f68; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,41,124,.35); }\n    .btn--blue  { background: var(--blue); color: var(--white); }\n    .btn--blue:hover { background: var(--blue-dark); transform: translateY(-2px); }\n    .btn--outline-white {\n      background: transparent;\n      color: var(--white);\n      border-color: rgba(255,255,255,.5);\n    }\n    .btn--outline-white:hover { background: rgba(255,255,255,.12); border-color: var(--white); }\n    .btn--outline-blue {\n      background: transparent;\n      color: var(--blue);\n      border-color: var(--blue);\n    }\n    .btn--outline-blue:hover { background: var(--blue); color: var(--white); }\n    .btn-icon { width: 18px; height: 18px; }\n\n    /* ===== NAV ===== */\n    .nav {\n      position: fixed;\n      top: 0; left: 0; right: 0;\n      z-index: 1000;\n      background: rgba(9,28,90,.96);\n      backdrop-filter: blur(12px);\n      border-bottom: 1px solid rgba(255,255,255,.08);\n      transition: var(--transition);\n    }\n    .nav.scrolled {\n      background: rgba(9,28,90,.99);\n      box-shadow: 0 4px 24px rgba(0,0,0,.25);\n    }\n    .nav-inner {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      height: 70px;\n    }\n    .nav-logo { display: flex; align-items: center; }\n    .nav-logo img { height: 38px; width: auto; filter: brightness(0) invert(1); }    .nav-links {\n      display: flex;\n      align-items: center;\n      gap: 4px;\n      list-style: none;\n    }\n    .nav-links a {\n      padding: 8px 14px;\n      border-radius: 8px;\n      font-size: .875rem;\n      font-weight: 500;\n      color: rgba(255,255,255,.8);\n      transition: var(--transition);\n    }\n    .nav-links a:hover { color: var(--white); background: rgba(255,255,255,.1); }\n    .nav-cta { display: flex; align-items: center; gap: 10px; }\n    .nav-hamburger {\n      display: none;\n      flex-direction: column;\n      gap: 5px;\n      background: none;\n      border: none;\n      padding: 8px;\n    }\n    .nav-hamburger span {\n      display: block; width: 24px; height: 2px;\n      background: var(--white);\n      border-radius: 2px;\n      transition: var(--transition);\n    }\n\n    /* Mobile nav */\n    .nav-mobile {\n      display: none;\n      position: fixed;\n      inset: 0;\n      background: var(--blue-deep);\n      z-index: 999;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      gap: 8px;\n    }\n    .nav-mobile.open { display: flex; }\n    .nav-mobile a {\n      font-size: 1.5rem;\n      font-weight: 700;\n      color: var(--white);\n      padding: 12px 32px;\n      border-radius: 12px;\n      transition: var(--transition);\n    }\n    .nav-mobile a:hover { background: rgba(255,255,255,.1); }\n    .nav-mobile-close {\n      position: absolute;\n      top: 20px; right: 20px;\n      background: none; border: none;\n      color: var(--white);\n      font-size: 2rem;\n      line-height: 1;\n    }\n\n    /* ===== HERO ===== */\n    .hero {\n      min-height: 100vh;\n      background: linear-gradient(135deg, #0C1F50 0%, #1a2d72 45%, #2d1450 100%);\n      display: flex;\n      align-items: center;\n      position: relative;\n      overflow: hidden;\n      padding-top: 70px;\n    }\n    .hero-bg {\n      position: absolute;\n      inset: 0;\n      pointer-events: none;\n    }\n    .hero-circle-1 {\n      position: absolute;\n      width: 700px; height: 700px;\n      border-radius: 50%;\n      background: radial-gradient(circle, rgba(239,89,161,.22) 0%, transparent 70%);\n      top: -150px; right: -150px;\n    }\n    .hero-circle-2 {\n      position: absolute;\n      width: 500px; height: 500px;\n      border-radius: 50%;\n      background: radial-gradient(circle, rgba(30,77,150,.4) 0%, transparent 70%);\n      bottom: -50px; left: -100px;\n    }\n    .hero-circle-3 {\n      position: absolute;\n      width: 300px; height: 300px;\n      border-radius: 50%;\n      background: radial-gradient(circle, rgba(239,89,161,.12) 0%, transparent 70%);\n      top: 40%; left: 35%;\n    }\n    .hero-lotus {\n      position: absolute;\n      right: 5%;\n      top: 50%;\n      transform: translateY(-50%);\n      width: 480px;\n      height: 480px;\n      opacity: .07;\n    }\n    /* Decorative floating petals */\n    .hero-petal {\n      position: absolute;\n      border-radius: 50% 0 50% 0;\n      background: rgba(239,89,161,.15);\n      animation: floatPetal 8s ease-in-out infinite;\n    }\n    .hero-petal:nth-child(1){ width:80px;height:80px;top:15%;left:8%;animation-delay:0s; }\n    .hero-petal:nth-child(2){ width:50px;height:50px;top:65%;left:12%;animation-delay:2s;border-radius:0 50% 0 50%; }\n    .hero-petal:nth-child(3){ width:64px;height:64px;top:25%;right:22%;animation-delay:4s; }\n    @keyframes floatPetal {\n      0%,100% { transform: translateY(0) rotate(0deg); opacity:.15; }\n      50%      { transform: translateY(-18px) rotate(15deg); opacity:.25; }\n    }\n    .hero-content {\n      position: relative;\n      z-index: 1;\n      padding: 80px 0;\n    }\n    .hero-eyebrow {\n      display: flex; align-items: center; gap: 12px;\n      margin-bottom: 28px;\n    }\n    .hero-eyebrow-line {\n      width: 40px; height: 2px;\n      background: var(--pink);\n      border-radius: 2px;\n    }\n    .hero-eyebrow-text {\n      font-size: .8rem;\n      font-weight: 700;\n      letter-spacing: .12em;\n      text-transform: uppercase;\n      color: var(--pink-soft);\n    }\n    .hero h1 {\n      font-size: clamp(2.5rem, 6vw, 4.5rem);\n      color: var(--white);\n      line-height: 1.1;\n      margin-bottom: 24px;\n      max-width: 760px;\n    }\n    .hero h1 em {\n      font-style: normal;\n      color: var(--pink);\n    }\n    .hero-sub {\n      font-size: 1.1rem;\n      color: rgba(255,255,255,.72);\n      max-width: 520px;\n      margin-bottom: 40px;\n      line-height: 1.7;\n    }\n    .hero-actions {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 14px;\n      margin-bottom: 72px;\n    }\n    .hero-stats {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 40px;\n      padding-top: 40px;\n      border-top: 1px solid rgba(255,255,255,.12);\n    }\n    .hero-stat-num {\n      font-size: 2.25rem;\n      font-weight: 900;\n      color: var(--white);\n      line-height: 1;\n    }\n    .hero-stat-num span { color: var(--pink); }\n    .hero-stat-label {\n      font-size: .78rem;\n      color: rgba(255,255,255,.55);\n      font-weight: 500;\n      margin-top: 4px;\n      text-transform: uppercase;\n      letter-spacing: .06em;\n    }\n\n    /* ===== TRUST BAR ===== */\n    .trust-bar {\n      background: var(--white);\n      border-bottom: 1px solid var(--border);\n      padding: 20px 0;\n    }\n    .trust-bar-inner {\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: 12px;\n      flex-wrap: wrap;\n    }\n    .trust-label {\n      font-size: .78rem;\n      font-weight: 600;\n      color: var(--muted);\n      text-transform: uppercase;\n      letter-spacing: .08em;\n      white-space: nowrap;\n    }\n    .trust-partners {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      flex-wrap: wrap;\n    }\n    .trust-partner-chip {\n      display: inline-flex;\n      align-items: center;\n      gap: 6px;\n      padding: 6px 14px;\n      border-radius: 100px;\n      border: 1.5px solid var(--border);\n      font-size: .78rem;\n      font-weight: 600;\n      color: var(--muted);\n    }\n    .trust-partner-dot {\n      width: 8px; height: 8px;\n      border-radius: 50%;\n      background: var(--blue);\n    }\n\n    /* ===== ABOUT ===== */\n    .about-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 72px;\n      align-items: center;\n    }\n    .about-visual {\n      position: relative;\n    }\n    .about-activity-badge {\n      display: inline-flex;\n      align-items: center;\n      gap: 7px;\n      background: var(--pink);\n      color: var(--white);\n      font-size: .75rem;\n      font-weight: 700;\n      padding: 8px 16px;\n      border-radius: 100px;\n      margin-bottom: 14px;\n      box-shadow: 0 4px 16px rgba(232,  <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== TRUST BAR ===== -->\n  <div class=\"trust-bar\">\n    <div class=\"container\">\n      <div class=\"trust-bar-inner\">\n        <span class=\"trust-label\">Được tin tưởng bởi<\u002Fspan>\n        <div class=\"trust-partners\">\n          <div class=\"trust-partner-chip\"><div class=\"trust-partner-dot\"><\u002Fdiv> Nhà tài trợ cá nhân<\u002Fdiv>\n          <div class=\"trust-partner-chip\"><div class=\"trust-partner-dot\" style=\"background:var(--pink)\"><\u002Fdiv> Đối tác doanh nghiệp<\u002Fdiv>\n          <div class=\"trust-partner-chip\"><div class=\"trust-partner-dot\" style=\"background:#10B981\"><\u002Fdiv> Tổ chức giáo dục<\u002Fdiv>\n          <div class=\"trust-partner-chip\"><div class=\"trust-partner-dot\" style=\"background:#F59E0B\"><\u002Fdiv> Cộng đồng quốc tế<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== ABOUT ===== -->\n  <section class=\"section\" id=\"about\">\n    <div class=\"container\">\n      <div class=\"about-grid\">\n        <div class=\"about-visual\">\n          <div class=\"about-activity-badge\">\n            <span class=\"dot\"><\u002Fspan>\n            Ảnh hoạt động thực tế\n          <\u002Fdiv>\n          <div class=\"about-photo-main\">\n            <img src=\"d3d89bd8-819f-4b95-a8b3-a4a7245d4a07\" alt=\"Sinh viên Học bổng Sen Hồng\" loading=\"lazy\" onerror=\"this.onerror=null;this.src='https://picsum.photos/seed/students/600/750'\">\n          <\u002Fdiv>\n          <div class=\"about-photo-small\">\n            <img src=\"2a45cd01-e405-444a-9f19-fa497803863b\" alt=\"Lễ trao học bổng\" loading=\"lazy\" onerror=\"this.onerror=null;this.src='https://picsum.photos/seed/senhong/300/300'\">\n          <\u002Fdiv>\n          <div class=\"about-quote-card\">\n            <p>\"Học bổng không chỉ là tiền — đó là niềm tin rằng tôi có thể làm được.\"<\u002Fp>\n            <div class=\"aq-author\">— Nguyễn Thị Lan, SV ĐH Bách Khoa TP.HCM<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"about-text fade-up\">\n          <div class=\"section-label\">\n            <span class=\"badge badge--pink\" data-id=\"about-badge\">Về chúng tôi / About Us<\u002Fspan>\n          <\u002Fdiv>\n          <h2 data-id=\"about-h2\">Chúng tôi là <span class=\"text-pink\">ai?<\u002Fspan><\u002Fh2>\n          <p data-id=\"about-p1\">The Relay Fund – Học bổng Sen Hồng được thành lập với một niềm tin đơn giản: <strong>mọi sinh viên tài năng đều xứng đáng có cơ hội<\u002Fstrong>, bất kể hoàn cảnh xuất phát điểm.<\u002Fp>\n          <p data-id=\"about-p2\">Chúng tôi kết nối những nhà tài trợ giàu tâm huyết với những sinh viên đang cần được tiếp sức — để tạo nên một chuỗi truyền lửa không ngừng cho thế hệ tương lai Việt Nam.<\u002Fp>\n          <div class=\"about-pillars\">\n            <div class=\"pillar-card\">\n              <div class=\"pillar-icon pillar-icon--pink\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E8297C\" stroke-width=\"2.5\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <h4>Sứ mệnh<\u002Fh4>\n              <p>Trao cơ hội học tập bình đẳng cho sinh viên có hoàn cảnh khó khăn, truyền lửa và kết nối cộng đồng.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"pillar-card\">\n              <div class=\"pillar-icon pillar-icon--blue\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B50BE\" stroke-width=\"2.5\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 6v6l4 2\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <h4>Tầm nhìn<\u002Fh4>\n              <p>Xây dựng một thế hệ lãnh đạo trẻ Việt Nam vượt khó, có bản lĩnh và khát vọng cống hiến.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"pillar-card\">\n              <div class=\"pillar-icon pillar-icon--pink\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E8297C\" stroke-width=\"2.5\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <h4>Minh bạch<\u002Fh4>\n              <p>Mọi nguồn tài trợ được quản lý công khai, báo cáo định kỳ và trách nhiệm với từng nhà tài trợ.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"pillar-card\">\n              <div class=\"pillar-icon pillar-icon--blue\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B50BE\" stroke-width=\"2.5\"><polyline points=\"22 12 18 12 15 21 9 3 6 12 2 12\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fdiv>\n              <h4>Tác động thực<\u002Fh4>\n              <p>Chúng tôi theo dõi hành trình từng sinh viên — từ khi nhận học bổng đến khi tốt nghiệp và đi làm.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== IMPACT ===== -->\n  <section class=\"section impact-section\" id=\"impact\">\n    <div class=\"container\" style=\"position:relative;z-index:1;\">\n      <div class=\"impact-header fade-up\">\n        <div class=\"section-label\" style=\"justify-content:center;margin-bottom:14px;\">\n          <span class=\"badge badge--white\" data-id=\"impact-badge\">Tác động / Impact<\u002Fspan>\n        <\u002Fdiv>\n        <h2 data-id=\"impact-h2\">Những con số <span style=\"color:var(--pink-soft);\">biết nói<\u002Fspan><\u002Fh2>\n        <p data-id=\"impact-sub\">Mỗi con số là một cuộc đời được thay đổi, một ước mơ được nâng đỡ.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"impact-grid\">\n        <div class=\"impact-card fade-up\">\n          <div class=\"impact-card-num\"><span class=\"count\" data-target=\"150\">0<\u002Fspan><em>+<\u002Fem><\u002Fdiv>\n          <div class=\"impact-card-label\" data-id=\"ic-1\">Sinh viên nhận học bổng<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"impact-card fade-up\">\n          <div class=\"impact-card-num\"><span class=\"count\" data-target=\"95\">0<\u002Fspan><em>%<\u002Fem><\u002Fdiv>\n          <div class=\"impact-card-label\" data-id=\"ic-2\">Tốt nghiệp đúng hạn<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"impact-card fade-up\">\n          <div class=\"impact-card-num\"><span class=\"count\" data-target=\"30\">0<\u002Fspan><em>+<\u002Fem><\u002Fdiv>\n          <div class=\"impact-card-label\" data-id=\"ic-3\">Tỉnh thành trong cả nước<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"impact-card fade-up\">\n          <div class=\"impact-card-num\"><span class=\"count\" data-target=\"80\">0<\u002Fspan><em>+<\u002Fem><\u002Fdiv>\n          <div class=\"impact-card-label\" data-id=\"ic-4\">Nhà tài trợ &amp; đối tác<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== PROGRAMS ===== -->\n  <section class=\"section section--cream\" id=\"programs\">\n    <div class=\"container\">\n      <div class=\"programs-header fade-up\">\n        <div class=\"section-label\" style=\"justify-content:center;margin-bottom:14px;\">\n          <span class=\"badge badge--pink\" data-id=\"prog-badge\">Chương trình / Programs<\u002Fspan>\n        <\u002Fdiv>\n        <h2 data-id=\"prog-h2\">Học bổng <span class=\"text-pink\">Sen Hồng<\u002Fspan><\u002Fh2>\n        <p data-id=\"prog-sub\">Chương trình học bổng dành riêng cho nữ sinh Việt Nam có hoàn cảnh khó khăn — không chỉ hỗ trợ tài chính, mà còn đồng hành toàn diện trong suốt hành trình học tập.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"program-card fade-up\">\n        <div class=\"program-visual\">\n          <div class=\"prog-title\">\n            <div class=\"prog-name\">Học bổng<br>Sen Hồng<\u002Fdiv>\n            <div class=\"prog-en\">Pink Lotus Scholarship<\u002Fdiv>\n          <\u002Fdiv>\n          <!-- Lotus bg decoration -->\n          <svg class=\"program-lotus-bg\" viewBox=\"0 0 280 280\" fill=\"white\" xmlns=\"http://www.w3.org/2000/svg\">\n            <ellipse cx=\"140\" cy=\"200\" rx=\"24\" ry=\"95\"><\u002Fellipse>\n            <ellipse cx=\"140\" cy=\"200\" rx=\"22\" ry=\"85\" transform=\"rotate(-22 140 200)\"><\u002Fellipse>\n            <ellipse cx=\"140\" cy=\"200\" rx=\"22\" ry=\"85\" transform=\"rotate(22 140 200)\"><\u002Fellipse>\n            <ellipse cx=\"140\" cy=\"208\" rx=\"18\" ry=\"68\" transform=\"rotate(-50 140 208)\"><\u002Fellipse>\n            <ellipse cx=\"140\" cy=\"208\" rx=\"18\" ry=\"68\" transform=\"rotate(50 140 208)\"><\u002Fellipse>\n            <ellipse cx=\"140\" cy=\"218\" rx=\"62\" ry=\"12\"><\u002Fellipse>\n          <\u002Fsvg>\n          <div class=\"prog-stat\">\n            <div class=\"prog-stat-num\">20 tr.<\u002Fdiv>\n            <div class=\"prog-stat-label\">giá trị mỗi suất học bổng / năm<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"program-details\">\n          <h3>Điều kiện &amp; Quy trình ứng tuyển<\u002Fh3>\n          <div class=\"prog-detail-group\">\n            <h4>Đối tượng<\u002Fh4>\n            <div class=\"prog-tags\">\n              <span class=\"prog-tag\" style=\"background:var(--pink-pale);color:var(--pink);font-weight:700;\">Dành cho Nữ sinh<\u002Fspan>\n              <span class=\"prog-tag\">Sinh viên năm 1–4<\u002Fspan>\n              <span class=\"prog-tag\">Hoàn cảnh khó khăn<\u002Fspan>\n              <span class=\"prog-tag\">GPA ≥ 2.5/4.0<\u002Fspan>\n              <span class=\"prog-tag\">Đang học tại Việt Nam<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"prog-detail-group\">\n            <h4>Tiêu chí xét duyệt<\u002Fh4>\n            <div class=\"prog-tags\">\n              <span class=\"prog-tag\">Nghị lực vượt khó<\u002Fspan>\n              <span class=\"prog-tag\">Kết quả học tập<\u002Fspan>\n              <span class=\"prog-tag\">Hoạt động xã hội<\u002Fspan>\n              <span class=\"prog-tag\">Định hướng tương lai<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"prog-detail-group\">\n            <h4>Quy trình ứng tuyển<\u002Fh4>\n            <div class=\"prog-steps\">\n              <div class=\"prog-step\">\n                <div class=\"prog-step-num\">1<\u002Fdiv>\n                <p><strong>Nộp hồ sơ online<\u002Fstrong> — điền form, đính kèm tài liệu cần thiết trong thời gian tuyển sinh.<\u002Fp>\n              <\u002Fdiv>\n              <div class=\"prog-step\">\n                <div class=\"prog-step-num\">2<\u002Fdiv>\n                <p><strong>Xét duyệt hồ sơ<\u002Fstrong> — hội đồng xét học bổng thẩm định trong vòng 3 tuần.<\u002Fp>\n              <\u002Fdiv>\n              <div class=\"prog-step\">\n                <div class=\"prog-step-num\">3<\u002Fdiv>\n                <p><strong>Phỏng vấn<\u002Fstrong> — ứng viên tiềm năng được mời trao đổi trực tiếp hoặc online.<\u002Fp>\n              <\u002Fdiv>\n              <div class=\"prog-step\">\n                <div class=\"prog-step-num\">4<\u002Fdiv>\n                <p><strong>Thông báo kết quả<\u002Fstrong> — công bố danh sách và tiến hành trao học bổng.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"#contact\" class=\"btn btn--pink\">Ứng tuyển ngay<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== STORIES ===== -->\n  <section class=\"section\" id=\"stories\">\n    <div class=\"container\">\n      <div class=\"stories-header\">\n        <div>\n          <div class=\"section-label\" style=\"margin-bottom:14px;\">\n            <span class=\"badge badge--blue\" data-id=\"stories-badge\">Câu chuyện / Stories<\u002Fspan>\n          <\u002Fdiv>\n          <h2 data-id=\"stories-h2\">Tiếng lòng của <span class=\"text-pink\">người được trao<\u002Fspan><\u002Fh2>\n        <\u002Fdiv>\n        <a href=\"#contact\" class=\"btn btn--outline-blue\">Chia sẻ câu chuyện của bạn<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"stories-grid\">\n        <div class=\"story-card fade-up\">\n          <div class=\"story-quote-mark\">\"<\u002Fdiv>\n          <p class=\"story-text\">Học bổng Sen Hồng không chỉ giúp tôi trả học phí — nó cho tôi thấy có những người tin tưởng vào tôi. Điều đó tiếp thêm động lực để tôi không bỏ cuộc dù khó khăn đến đâu.<\u002Fp>\n          <div class=\"story-author\">\n            <div class=\"story-avatar\" style=\"background:var(--blue);\">L<\u002Fdiv>\n            <div>\n              <div class=\"story-author-name\">Lê Văn Minh<\u002Fdiv>\n              <div class=\"story-author-meta\">Sinh viên Kỹ thuật, ĐH Bách Khoa HN · Khoá 2022<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"story-card fade-up\">\n          <div class=\"story-quote-mark\">\"<\u002Fdiv>\n          <p class=\"story-text\">Tôi đến từ một gia đình nông dân nghèo ở Nghệ An. Nếu không có Relay Fund, có lẽ tôi đã không thể học đại học. Bây giờ tôi sắp tốt nghiệp và muốn trở thành cầu nối cho các em sau này.<\u002Fp>\n          <div class=\"story-author\">\n            <div class=\"story-avatar\" style=\"background:var(--pink);\">N<\u002Fdiv>\n            <div>\n              <div class=\"story-author-name\">Nguyễn Thị Thu Hà<\u002Fdiv>\n              <div class=\"story-author-meta\">Sinh viên Kinh tế, ĐH Kinh tế Quốc dân · Khoá 2021<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"story-card fade-up\">\n          <div class=\"story-quote-mark\">\"<\u002Fdiv>\n          <p class=\"story-text\">Tôi ấn tượng nhất là sự đồng hành — không chỉ tiền mà còn có mentorship, kết nối việc làm, và một cộng đồng ấm áp. Đó là điều khiến Relay Fund khác biệt.<\u002Fp>\n          <div class=\"story-author\">\n            <div class=\"story-avatar\" style=\"background:#10B981;\">P<\u002Fdiv>\n            <div>\n              <div class=\"story-author-name\">Phạm Thị Lan Anh<\u002Fdiv>\n              <div class=\"story-author-meta\">Cựu sinh viên, Đang làm tại TP.HCM · Khoá 2019<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- Donor testimonials -->\n      <div style=\"margin-top:48px;padding:40px;background:var(--cream);border-radius:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px;\" class=\"fade-up\">\n        <div>\n          <div style=\"font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:16px;\">Nhà tài trợ nói gì<\u002Fdiv>\n          <p style=\"font-size:1rem;font-weight:600;line-height:1.65;color:var(--text);\">\"Tôi tài trợ vì tôi tin vào sự minh bạch và cách Relay Fund kể câu chuyện của từng sinh viên. Tôi biết tiền của mình đi đến đúng chỗ.\"<\u002Fp>\n          <div style=\"margin-top:14px;font-size:.82rem;color:var(--muted);\">— Anh Trần Đức Thịnh, Nhà tài trợ cá nhân từ năm 2021<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-left:1px solid var(--border);padding-left:24px;\">\n          <div style=\"font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:16px;\">Đối tác chia sẻ<\u002Fdiv>\n          <p style=\"font-size:1rem;font-weight:600;line-height:1.65;color:var(--text);\">\"Đây là tổ chức trẻ nhưng làm việc rất chuyên nghiệp. Chúng tôi tự hào khi là đối tác giáo dục của Relay Fund.\"<\u002Fp>\n          <div style=\"margin-top:14px;font-size:.82rem;color:var(--muted);\">— Đại diện Trường Đại học đối tác<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== GET INVOLVED ===== -->\n  <section class=\"section section--cream\" id=\"involved\">\n    <div class=\"container\">\n      <div style=\"text-align:center;max-width:600px;margin:0 auto 56px;\" class=\"fade-up\">\n        <div class=\"section-label\" style=\"justify-content:center;margin-bottom:14px;\">\n          <span class=\"badge badge--blue\" data-id=\"inv-badge\">Tham gia / Get Involved<\u002Fspan>\n        <\u002Fdiv>\n        <h2 data-id=\"inv-h2\">Bạn muốn <span class=\"text-pink\">đồng hành<\u002Fspan> cùng Sen Hồng?<\u002Fh2>\n        <p class=\"text-muted\" data-id=\"inv-sub\">Dù là nữ sinh ứng tuyển, tình nguyện viên nhiệt huyết hay nhà tài trợ — đều có chỗ cho bạn trong hành trình này.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"involved-grid\">\n        <!-- Apply -->\n        <div class=\"involved-card involved-card--pink fade-up\">\n          <svg class=\"involved-bg-deco\" viewBox=\"0 0 150 150\" fill=\"white\" xmlns=\"http://www.w3.org/2000/svg\">\n            <ellipse cx=\"75\" cy=\"110\" rx=\"18\" ry=\"60\"><\u002Fellipse>\n            <ellipse cx=\"75\" cy=\"110\" rx=\"16\" ry=\"54\" transform=\"rotate(-25 75 110)\"><\u002Fellipse>\n            <ellipse cx=\"75\" cy=\"110\" rx=\"16\" ry=\"54\" transform=\"rotate(25 75 110)\"><\u002Fellipse>\n            <ellipse cx=\"75\" cy=\"116\" rx=\"40\" ry=\"8\"><\u002Fellipse>\n          <\u002Fsvg>\n          <div class=\"involved-icon involved-icon--pink-bg\">\n            <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"2.5\"><path d=\"M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 6v4l3 3\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"1\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <h3>Ứng tuyển học bổng<\u002Fh3>\n          <p>Bạn là nữ sinh đại học có hoàn cảnh khó khăn, nghị lực và ước mơ? Hồ sơ Sen Hồng đang chờ bạn — đơn giản, minh bạch và đầy tôn trọng.<\u002Fp>\n          <a href=\"#contact\" class=\"btn btn--outline-white\">Nộp hồ sơ ngay →<\u002Fa>\n        <\u002Fdiv>\n        <!-- Volunteer -->\n        <div class=\"involved-card involved-card--blue fade-up\">\n          <svg class=\"involved-bg-deco\" viewBox=\"0 0 150 150\" fill=\"white\" xmlns=\"http://www.w3.org/2000/svg\">\n            <ellipse cx=\"75\" cy=\"110\" rx=\"18\" ry=\"60\"><\u002Fellipse>\n            <ellipse cx=\"75\" cy=\"110\" rx=\"16\" ry=\"54\" transform=\"rotate(-25 75 110)\"><\u002Fellipse>\n            <ellipse cx=\"75\" cy=\"110\" rx=\"16\" ry=\"54\" transform=\"rotate(25 75 110)\"><\u002Fellipse>\n            <ellipse cx=\"75\" cy=\"116\" rx=\"40\" ry=\"8\"><\u002Fellipse>\n          <\u002Fsvg>\n          <div class=\"involved-icon involved-icon--blue-bg\">\n            <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"2.5\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3>Tham gia tình nguyện<\u002Fh3>\n          <p>Bạn có kỹ năng, thời gian và mong muốn tạo ra tác động? Tình nguyện viên Sen Hồng đang cần bạn — xét duyệt hồ sơ, mentoring, truyền thông và hơn thế.<\u002Fp>\n          <a href=\"#contact\" class=\"btn btn--outline-white\">Đăng ký tình nguyện →<\u002Fa>\n        <\u002Fdiv>\n        <!-- Sponsor -->\n        <div class=\"involved-card involved-card--outline fade-up\">\n          <svg class=\"involved-bg-deco\" viewBox=\"0 0 150 150\" fill=\"var(--blue-deep)\" xmlns=\"http://www.w3.org/2000/svg\" opacity=\".04\">\n            <ellipse cx=\"75\" cy=\"110\" rx=\"18\" ry=\"60\"><\u002Fellipse>\n            <ellipse cx=\"75\" cy=\"110\" rx=\"16\" ry=\"54\" transform=\"rotate(-25 75 110)\"><\u002Fellipse>\n            <ellipse cx=\"75\" cy=\"110\" rx=\"16\" ry=\"54\" transform=\"rotate(25 75 110)\"><\u002Fellipse>\n            <ellipse cx=\"75\" cy=\"116\" rx=\"40\" ry=\"8\"><\u002Fellipse>\n          <\u002Fsvg>\n          <div class=\"involved-icon involved-icon--cream-bg\">\n            <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--blue)\" stroke-width=\"2.5\"><path d=\"M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3>Nhà tài trợ &amp; Đối tác<\u002Fh3>\n          <p>Đồng hành tài chính cùng Sen Hồng — mỗi đóng góp trực tiếp tạo ra cơ hội học tập cho nữ sinh. 100% minh bạch với báo cáo định kỳ.<\u002Fp>\n          <a href=\"#contact\" class=\"btn btn--blue\">Liên hệ hợp tác →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== CONTACT ===== -->\n  <section class=\"section\" id=\"contact\">\n    <div class=\"container\">\n      <div class=\"contact-grid\">\n        <div class=\"contact-info fade-up\">\n          <div class=\"section-label\" style=\"margin-bottom:14px;\">\n            <span class=\"badge badge--pink\" data-id=\"contact-badge\">Liên hệ / Contact<\u002Fspan>\n          <\u002Fdiv>\n          <h2 data-id=\"contact-h2\">Hãy cùng chúng tôi <span class=\"text-pink\">bắt đầu<\u002Fspan><\u002Fh2>\n          <p data-id=\"contact-sub\">Dù bạn muốn ứng tuyển học bổng, trở thành nhà tài trợ hay đơn giản chỉ muốn biết thêm — chúng tôi luôn sẵn lòng lắng nghe.<\u002Fp>\n          <div class=\"contact-links\">\n            <a href=\"https://www.facebook.com/hbsenhong\" class=\"contact-link\" target=\"_blank\" rel=\"noopener\">\n              <div class=\"contact-link-icon\">\n                <svg viewBox=\"0 0 24 24\" fill=\"var(--blue)\"><path d=\"M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"contact-link-text\">\n                <strong>Facebook<\u002Fstrong>\n                <span>facebook.com/hbsenhong<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fa>\n            <a href=\"#\" class=\"contact-link\">\n              <div class=\"contact-link-icon\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--blue)\" stroke-width=\"2\"><path d=\"M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z\"><\u002Fpath><rect x=\"2\" y=\"9\" width=\"4\" height=\"12\"><\u002Frect><circle cx=\"4\" cy=\"4\" r=\"2\"><\u002Fcircle><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"contact-link-text\">\n                <strong>LinkedIn<\u002Fstrong>\n                <span>linkedin.com/company/relayfund<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fa>\n            <a href=\"mailto:info@relayfund.vn\" class=\"contact-link\">\n              <div class=\"contact-link-icon\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--blue)\" stroke-width=\"2\"><path d=\"M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z\"><\u002Fpath><polyline points=\"22,6 12,13 2,6\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"contact-link-text\">\n                <strong>Email<\u002Fstrong>\n                <span>info@relayfund.vn<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"contact-form fade-up\">\n          <h3 style=\"margin-bottom:24px;\">Gửi thông tin cho chúng tôi<\u002Fh3>\n          <div class=\"form-row\">\n            <div class=\"form-group\">\n              <label>Họ và tên *<\u002Flabel>\n              <input type=\"text\" placeholder=\"Nguyễn Văn A\">\n            <\u002Fdiv>\n            <div class=\"form-group\">\n              <label>Email *<\u002Flabel>\n              <input type=\"email\" placeholder=\"email@example.com\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"form-full form-group\">\n            <label>Bạn muốn<\u002Flabel>\n            <select>\n              <option value=\"\">Chọn mục đích liên hệ<\u002Foption>\n              <option>Ứng tuyển học bổng Sen Hồng<\u002Foption>\n              <option>Trở thành nhà tài trợ cá nhân<\u002Foption>\n              <option>Hợp tác doanh nghiệp / Tổ chức<\u002Foption>\n              <option>Đăng ký tình nguyện<\u002Foption>\n              <option>Câu hỏi khác<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <div class=\"form-full form-group\">\n            <label>Lời nhắn<\u002Flabel>\n            <textarea placeholder=\"Chia sẻ với chúng tôi câu chuyện của bạn hoặc điều bạn muốn biết thêm...\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <button class=\"btn btn--pink form-submit\" id=\"submitBtn\">\n            <svg class=\"btn-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"><\u002Fline><polygon points=\"22 2 15 22 11 13 2 9 22 2\"><\u002Fpolygon><\u002Fsvg>\n            Gửi thông tin\n          <\u002Fbutton>\n          <p style=\"margin-top:14px;font-size:.78rem;color:var(--muted);text-align:center;\">Chúng tôi sẽ phản hồi trong vòng 24–48 giờ làm việc.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== BACK TO TOP ===== -->\n  <div class=\"back-to-top\" id=\"backToTop\">\n    <button class=\"btt-btn\" onclick=\"window.scrollTo({top:0,behavior:'smooth'})\" aria-label=\"Back to top\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"18 15 12 9 6 15\"><\u002Fpolyline><\u002Fsvg>\n    <\u002Fbutton>\n    <span class=\"btt-label\" id=\"bttLabel\">Về đầu trang<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- ===== FOOTER ===== -->\n  <footer class=\"footer\">\n    <div class=\"container\">\n      <div class=\"footer-top\">\n        <div class=\"footer-brand\">\n          <img src=\"2467d23d-1bb7-41fb-ac7c-a50b584a29f5\" alt=\"The Relay Fund\" class=\"footer-logo\">\n          <p>The Relay Fund – Học bổng Sen Hồng. Học bổng dành riêng cho nữ sinh Việt Nam — nghị lực, tiềm năng và ước mơ không giới hạn.<\u002Fp>\n          <div style=\"margin-top:20px;\">\n            <a href=\"#involved\" class=\"footer-donate-chip\">\n              <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z\"><\u002Fpath><\u002Fsvg>\n              Ủng hộ quỹ\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"footer-col\">\n          <h4>Khám phá<\u002Fh4>\n          <ul>\n            <li><a href=\"#about\">Về chúng tôi<\u002Fa><\u002Fli>\n            <li><a href=\"#programs\">Học bổng Sen Hồng<\u002Fa><\u002Fli>\n            <li><a href=\"#impact\">Tác động<\u002Fa><\u002Fli>\n            <li><a href=\"#stories\">Câu chuyện<\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"footer-col\">\n          <h4>Tham gia<\u002Fh4>\n          <ul>\n            <li><a href=\"#contact\">Ứng tuyển học bổng<\u002Fa><\u002Fli>\n            <li><a href=\"#involved\">Trở thành nhà tài trợ<\u002Fa><\u002Fli>\n            <li><a href=\"#involved\">Tình nguyện viên<\u002Fa><\u002Fli>\n            <li><a href=\"#contact\">Hợp tác tổ chức<\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"footer-col\">\n          <h4>Kết nối<\u002Fh4>\n          <ul>\n            <li><a href=\"https://www.facebook.com/hbsenhong\" target=\"_blank\">Facebook<\u002Fa><\u002Fli>\n            <li><a href=\"#\">LinkedIn<\u002Fa><\u002Fli>\n            <li><a href=\"mailto:info@relayfund.vn\">Email<\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"footer-bottom\">\n        <span>© 2026 The Relay Fund – Học bổng Sen Hồng. Bảo lưu mọi quyền.<\u002Fspan>\n        <div class=\"footer-social\">\n          <a href=\"https://www.facebook.com/hbsenhong\" target=\"_blank\" rel=\"noopener\" aria-label=\"Facebook\">\n            <svg viewBox=\"0 0 24 24\" fill=\"white\"><path d=\"M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n          <a href=\"#\" aria-label=\"LinkedIn\">\n            <svg viewBox=\"0 0 24 24\" fill=\"white\"><path d=\"M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z\"><\u002Fpath><rect x=\"2\" y=\"9\" width=\"4\" height=\"12\"><\u002Frect><circle cx=\"4\" cy=\"4\" r=\"2\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <script>\n    // ===== NAV SCROLL =====\n    const nav = document.getElementById('nav');\n    window.addEventListener('scroll', () => {\n      nav.classList.toggle('scrolled', window.scrollY > 40);\n    });\n\n    // ===== MOBILE MENU =====\n    const hamburger = document.getElementById('hamburger');\n    const navMobile = document.getElementById('navMobile');\n    const navClose  = document.getElementById('navClose');\n    hamburger.addEventListener('click', () => navMobile.classList.add('open'));\n    navClose.addEventListener('click',  () => navMobile.classList.remove('open'));\n    document.querySelectorAll('.nav-mobile-link').forEach(a => {\n      a.addEventListener('click', () => navMobile.classList.remove('open'));\n    });\n\n    // ===== COUNTER ANIMATION =====\n    function animateCounter(el) {\n      const target = parseInt(el.dataset.target);\n      const duration = 1800;\n      const step = target / (duration / 16);\n      let current = 0;\n      const timer = setInterval(() => {\n        current = Math.min(current + step, target);\n        el.textContent = Math.floor(current);\n        if (current >= target) clearInterval(timer);\n      }, 16);\n    }\n\n    // ===== INTERSECTION OBSERVER =====\n    const countersStarted = new Set();\n    const observer = new IntersectionObserver((entries) => {\n      entries.forEach(entry => {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('visible');\n          // Animate counters inside visible elements\n          entry.target.querySelectorAll('.count').forEach(el => {\n            if (!countersStarted.has(el)) {\n              countersStarted.add(el);\n              animateCounter(el);\n            }\n          });\n        }\n      });\n    }, { threshold: 0.15 });\n\n    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));\n\n    // Animate hero counters immediately\n    setTimeout(() => {\n      document.querySelectorAll('.hero-stats .count').forEach(el => {\n        if (!countersStarted.has(el)) {\n          countersStarted.add(el);\n          animateCounter(el);\n        }\n      });\n    }, 500);\n\n    // ===== FORM SUBMIT =====\n    document.getElementById('submitBtn').addEventListener('click', function(e) {\n      e.preventDefault();\n      this.textContent = 'Đã gửi! Cảm ơn bạn ✓';\n      this.style.background = '#10B981';\n      this.style.borderColor = '#10B981';\n      setTimeout(() => {\n        this.innerHTML = '<svg class=\"btn-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"/><polygon points=\"22 2 15 22 11 13 2 9 22 2\"/><\u002Fsvg> Gửi thông tin';\n        this.style.background = '';\n        this.style.borderColor = '';\n      }, 3000);\n    });\n\n    // ===== BACK TO TOP =====\n    const btt = document.getElementById('backToTop');\n    const bttLabel = document.getElementById('bttLabel');\n    window.addEventListener('scroll', () => {\n      btt.classList.toggle('visible', window.scrollY > 400);\n    });\n\n    // ===== LANGUAGE TOGGLE =====\n    const translations = {\n      // NAV\n      '[data-id=\"nav-about\"]':    { vi: 'Về chúng tôi',   en: 'About Us' },\n      '[data-id=\"nav-programs\"]': { vi: 'Học bổng',        en: 'Programs' },\n      '[data-id=\"nav-impact\"]':   { vi: 'Tác động',        en: 'Impact' },\n      '[data-id=\"nav-stories\"]':  { vi: 'Câu chuyện',      en: 'Stories' },\n      '[data-id=\"nav-contact\"]':  { vi: 'Liên hệ',         en: 'Contact' },\n      // HERO\n      '[data-id=\"hero-eyebrow\"]': { vi: 'Học bổng dành riêng cho nữ sinh Việt Nam', en: 'Scholarship exclusively for Vietnamese female students' },\n      '[data-id=\"hero-h1\"]':      { vi: 'Nâng đỡ ước mơ.<br>Tiếp sức <em>nữ sinh.<\u002Fem>', en: 'Lift dreams.<br>Empower <em>young women.<\u002Fem>' },\n      '[data-id=\"hero-sub\"]':     { vi: 'Relay Fund – Học bổng Sen Hồng đồng hành cùng những nữ sinh tài năng, nghị lực vượt khó — để không một cô gái nào phải từ bỏ ước mơ vì thiếu điều kiện.', en: 'The Relay Fund – Pink Lotus Scholarship stands with talented, resilient young women — so no girl ever has to give up her dreams for lack of resources.' },\n      '[data-id=\"btn-apply\"]':    { vi: 'Ứng tuyển học bổng', en: 'Apply for Scholarship' },\n      '[data-id=\"btn-volunteer\"]':{ vi: 'Tham gia tình nguyện', en: 'Volunteer' },\n      '[data-id=\"btn-learn\"]':    { vi: 'Tìm hiểu thêm', en: 'Learn More' },\n      '[data-id=\"stat-1-label\"]': { vi: 'Sinh viên nhận học bổng', en: 'Scholarship Recipients' },\n      '[data-id=\"stat-2-label\"]': { vi: 'Năm hoạt động', en: 'Years Active' },\n      '[data-id=\"stat-3-label\"]': { vi: 'Nhà tài trợ & đối tác', en: 'Donors & Partners' },\n      '[data-id=\"stat-4-label\"]': { vi: 'Đồng đã trao', en: 'VND Granted' },\n      // ABOUT\n      '[data-id=\"about-badge\"]':  { vi: 'Về chúng tôi / About Us', en: 'About Us' },\n      '[data-id=\"about-h2\"]':     { vi: 'Chúng tôi là <span class=\"text-pink\">ai?<\u002Fspan>', en: 'Who <span class=\"text-pink\">we are<\u002Fspan>' },\n      '[data-id=\"about-p1\"]':     { vi: 'The Relay Fund – Học bổng Sen Hồng được thành lập với một niềm tin đơn giản: <strong>mọi sinh viên tài năng đều xứng đáng có cơ hội<\u002Fstrong>, bất kể hoàn cảnh xuất phát điểm.', en: 'The Relay Fund was founded on a simple belief: <strong>every talented student deserves a chance<\u002Fstrong>, regardless of their starting circumstances.' },\n      '[data-id=\"about-p2\"]':     { vi: 'Chúng tôi kết nối những nhà tài trợ giàu tâm huyết với những sinh viên đang cần được tiếp sức — để tạo nên một chuỗi truyền lửa không ngừng cho thế hệ tương lai Việt Nam.', en: 'We connect passionate donors with students in need — to create an endless relay of inspiration for Vietnam\\'s future generation.' },\n      // IMPACT\n      '[data-id=\"impact-badge\"]': { vi: 'Tác động / Impact', en: 'Impact' },\n      '[data-id=\"impact-h2\"]':    { vi: 'Những con số <span style=\"color:var(--pink-soft);\">biết nói<\u002Fspan>', en: 'Numbers that <span style=\"color:var(--pink-soft);\">speak<\u002Fspan>' },\n      '[data-id=\"impact-sub\"]':   { vi: 'Mỗi con số là một cuộc đời được thay đổi, một ước mơ được nâng đỡ.', en: 'Every number is a life changed, a dream supported.' },\n      '[data-id=\"ic-1\"]':         { vi: 'Sinh viên nhận học bổng', en: 'Scholarship Recipients' },\n      '[data-id=\"ic-2\"]':         { vi: 'Tốt nghiệp đúng hạn', en: 'On-time Graduation Rate' },\n      '[data-id=\"ic-3\"]':         { vi: 'Tỉnh thành trong cả nước', en: 'Provinces Reached' },\n      '[data-id=\"ic-4\"]':         { vi: 'Nhà tài trợ & đối tác', en: 'Donors & Partners' },\n      // PROGRAMS\n      '[data-id=\"prog-badge\"]':   { vi: 'Chương trình / Programs', en: 'Programs' },\n      '[data-id=\"prog-h2\"]':      { vi: 'Học bổng <span class=\"text-pink\">Sen Hồng<\u002Fspan>', en: 'Pink Lotus <span class=\"text-pink\">Scholarship<\u002Fspan>' },\n      '[data-id=\"prog-sub\"]':     { vi: 'Chương trình học bổng được thiết kế để không chỉ hỗ trợ tài chính, mà còn đồng hành toàn diện cùng sinh viên trong suốt hành trình học tập.', en: 'Our scholarship program is designed not just for financial support, but for holistic accompaniment throughout every student\\'s academic journey.' },\n      // STORIES\n      '[data-id=\"stories-badge\"]':{ vi: 'Câu chuyện / Stories', en: 'Stories' },\n      '[data-id=\"stories-h2\"]':   { vi: 'Tiếng lòng của <span class=\"text-pink\">người được trao<\u002Fspan>', en: 'Voices from <span class=\"text-pink\">our scholars<\u002Fspan>' },\n      // GET INVOLVED\n      '[data-id=\"inv-badge\"]':    { vi: 'Tham gia / Get Involved', en: 'Get Involved' },\n      '[data-id=\"inv-h2\"]':       { vi: 'Bạn muốn <span class=\"text-pink\">đồng hành<\u002Fspan> cùng Sen Hồng?', en: 'Want to <span class=\"text-pink\">join<\u002Fspan> the Sen Hồng journey?' },\n      '[data-id=\"inv-sub\"]':      { vi: 'Dù là nữ sinh ứng tuyển, tình nguyện viên nhiệt huyết hay nhà tài trợ — đều có chỗ cho bạn trong hành trình này.', en: 'Whether you\\'re a student applicant, passionate volunteer, or sponsor — there\\'s a place for you here.' },\n      // CONTACT\n      '[data-id=\"contact-badge\"]':{ vi: 'Liên hệ / Contact', en: 'Contact' },\n      '[data-id=\"contact-h2\"]':   { vi: 'Hãy cùng chúng tôi <span class=\"text-pink\">bắt đầu<\u002Fspan>', en: 'Let\\'s <span class=\"text-pink\">get started<\u002Fspan>' },\n      '[data-id=\"contact-sub\"]':  { vi: 'Dù bạn muốn ứng tuyển học bổng, trở thành nhà tài trợ hay đơn giản chỉ muốn biết thêm — chúng tôi luôn sẵn lòng lắng nghe.', en: 'Whether you want to apply for a scholarship, become a sponsor, or simply learn more — we\\'re always here to listen.' },\n    };\n\n    let currentLang = 'vi';\n    document.body.classList.add('lang-vi');\n\n    function applyLang(lang) {\n      currentLang = lang;\n      document.documentElement.lang = lang;\n      document.body.classList.toggle('lang-vi', lang === 'vi');\n      document.body.classList.toggle('lang-en', lang === 'en');\n      bttLabel.textContent = lang === 'vi' ? 'Về đầu trang' : 'Back to top';\n\n      // Apply all [data-vi] / [data-en] simple text nodes\n      document.querySelectorAll('[data-vi]').forEach(el => {\n        el.textContent = lang === 'vi' ? el.dataset.vi : el.dataset.en;\n      });\n\n      // Apply translations map (innerHTML)\n      Object.entries(translations).forEach(([sel, t]) => {\n        document.querySelectorAll(sel).forEach(el => {\n          el.innerHTML = lang === 'vi' ? t.vi : t.en;\n        });\n      });\n    }\n\n    document.getElementById('langToggle').addEventListener('click', () => {\n      applyLang(currentLang === 'vi' ? 'en' : 'vi');\n    });\n\n    // ===== TWEAKS =====\n    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n      \"primaryColor\": \"#E8297C\",\n      \"accentColor\": \"#1B50BE\",\n      \"fontStyle\": \"modern\",\n      \"showEnglish\": true\n    }/*EDITMODE-END*/;\n\n    window.addEventListener('message', e => {\n      if (e.data?.type === '__activate_edit_mode') showTweaks();\n      if (e.data?.type === '__deactivate_edit_mode') hideTweaks();\n    });\n    window.parent.postMessage({ type: '__edit_mode_available' }, '*');\n\n    function showTweaks() { document.getElementById('tweaksPanel').style.display = 'block'; }\n    function hideTweaks()  { document.getElementById('tweaksPanel').style.display = 'none'; }\n  <\u002Fscript>\n\n  <!-- TWEAKS PANEL -->\n  <div id=\"tweaksPanel\" style=\"display:none;position:fixed;bottom:24px;right:24px;z-index:9999;\n    background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);\n    border:1px solid #e5e7eb;padding:24px;width:260px;font-family:'Be Vietnam Pro',sans-serif;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;\">\n      <span style=\"font-size:.9rem;font-weight:700;color:#111827;\">Tweaks<\u002Fspan>\n      <button onclick=\"document.getElementById('tweaksPanel').style.display='none';window.parent.postMessage({type:'__edit_mode_dismissed'},'*')\" style=\"background:none;border:none;cursor:pointer;color:#6b7280;font-size:1.2rem;line-height:1;\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;margin-bottom:10px;\">Màu chính<\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-bottom:18px;\">\n      <button onclick=\"setColor('#E8297C')\" style=\"width:36px;height:36px;border-radius:50%;background:#E8297C;border:3px solid #fff;box-shadow:0 0 0 2px #E8297C;cursor:pointer;\"><\u002Fbutton>\n      <button onclick=\"setColor('#7C3AED')\" style=\"width:36px;height:36px;border-radius:50%;background:#7C3AED;border:3px solid #fff;cursor:pointer;\"><\u002Fbutton>\n      <button onclick=\"setColor('#0891B2')\" style=\"width:36px;height:36px;border-radius:50%;background:#0891B2;border:3px solid #fff;cursor:pointer;\"><\u002Fbutton>\n      <button onclick=\"setColor('#D97706')\" style=\"width:36px;height:36px;border-radius:50%;background:#D97706;border:3px solid #fff;cursor:pointer;\"><\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;margin-bottom:10px;\">Màu nền Hero<\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-bottom:18px;\">\n      <button onclick=\"setHero('#091C5A')\" style=\"width:36px;height:36px;border-radius:50%;background:#091C5A;border:3px solid #fff;box-shadow:0 0 0 2px #091C5A;cursor:pointer;\"><\u002Fbutton>\n      <button onclick=\"setHero('#1a1a2e')\" style=\"width:36px;height:36px;border-radius:50%;background:#1a1a2e;border:3px solid #fff;cursor:pointer;\"><\u002Fbutton>\n      <button onclick=\"setHero('#0f3d2e')\" style=\"width:36px;height:36px;border-radius:50%;background:#0f3d2e;border:3px solid #fff;cursor:pointer;\"><\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;margin-bottom:10px;\">Kiểu chữ<\u002Fdiv>\n    <div style=\"display:flex;gap:8px;\">\n      <button onclick=\"setFont('Be Vietnam Pro')\" style=\"flex:1;padding:8px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:.8rem;font-weight:600;cursor:pointer;background:#f9fafb;\">Modern<\u002Fbutton>\n      <button onclick=\"setFont('Georgia')\" style=\"flex:1;padding:8px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:.8rem;font-weight:600;cursor:pointer;background:#f9fafb;\">Classic<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <script>\n    function setColor(c) {\n      document.documentElement.style.setProperty('--pink', c);\n      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { primaryColor: c } }, '*');\n    }\n    function setHero(c) {\n      document.documentElement.style.setProperty('--blue-deep', c);\n    }\n    function setFont(f) {\n      document.body.style.fontFamily = f + ', sans-serif';\n    }\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
